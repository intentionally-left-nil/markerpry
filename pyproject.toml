[project]
name = "markerpry"
version = "0.5.0"
description = "A library for parsing and transforming Python packaging markers"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Anil Kulkarni" },
]
dependencies = [
    "packaging>=26.3",
]

[project.urls]
Documentation = "https://github.com/intentionally-left-nil/markerpry#readme"
Issues = "https://github.com/intentionally-left-nil/markerpry#readme"
Source = "https://github.com/intentionally-left-nil/markerpry#readme"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "markerpry"
module-root = ""

# Dev-only dependencies (PEP 735). Kept out of [project.dependencies] so the
# published package never pulls in test/lint/type-check tooling.
[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "ty>=0.0.69",
]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=markerpry",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["markerpry"]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py313"
src = ["markerpry", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
]

[tool.ty.environment]
python = "./.venv"
root = ["."]
